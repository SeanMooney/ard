---
microshift_install_local_path_provisioner: true
microshift_local_path_manifest_url: https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
microshift_default_storage_class: local-path
microshift_storage_class_names:
  local-path: local-path
  topolvm: topolvm-provisioner
microshift_kubeconfig: /var/lib/microshift/resources/kubeadmin/kubeconfig

local_path_enabled: "{{ microshift_install_local_path_provisioner }}"
local_path_cli: kubectl
local_path_admin_cli: oc
local_path_kubeconfig: "{{ microshift_kubeconfig }}"
local_path_cache_dir: ""
local_path_environment: {}
local_path_manifest_url: "{{ microshift_local_path_manifest_url }}"
local_path_default_storage_class: "{{ microshift_default_storage_class }}"
local_path_storage_class_names: "{{ microshift_storage_class_names }}"
local_path_namespace: local-path-storage
local_path_service_account: local-path-provisioner-service-account
local_path_scc: privileged
local_path_host_dir: /var/opt/local-path-provisioner
local_path_host_dir_mode: "0777"
local_path_prepare_host_dir: true
local_path_delegate_to: "{{ inventory_hostname }}"
local_path_become: true
local_path_host_delegate_to: "{{ local_path_delegate_to }}"
local_path_host_become: "{{ local_path_become }}"
