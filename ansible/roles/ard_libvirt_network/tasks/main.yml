---
- name: Create rendered libvirt network directory
  file:
    path: "{{ ard_deployment_dir }}/rendered/libvirt/networks"
    state: directory
    mode: "0755"

- name: Render libvirt network XML
  template:
    src: network.xml.j2
    dest: "{{ ard_deployment_dir }}/rendered/libvirt/networks/{{ item.key }}.xml"
    mode: "0644"
  vars:
    ard_libvirt_render_network_name: "{{ item.key }}"
    ard_libvirt_render_network: "{{ item.value }}"
  loop: "{{ ard_networks | dict2items }}"

- name: Ensure remote libvirt network render directory exists
  ansible.builtin.file:
    path: "{{ ard_libvirt_remote_render_dir }}/networks"
    state: directory
    mode: "0750"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Copy rendered libvirt network XML to execution host
  ansible.builtin.copy:
    src: "{{ ard_deployment_dir }}/rendered/libvirt/networks/{{ item.key }}.xml"
    dest: "{{ ard_libvirt_remote_render_dir }}/networks/{{ item.key }}.xml"
    mode: "0644"
  loop: "{{ ard_networks | dict2items }}"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Check whether libvirt networks exist
  command: "virsh --connect {{ ard_libvirt_uri }} net-info {{ item.value.provider.libvirt.name }}"
  register: ard_libvirt_network_info
  changed_when: false
  failed_when: false
  loop: "{{ ard_networks | dict2items }}"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Define libvirt networks
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ ard_libvirt_uri }}"
      - net-define
      - "{{ ard_libvirt_remote_render_dir }}/networks/{{ item.item.key }}.xml"
  when: item.rc != 0
  loop: "{{ ard_libvirt_network_info.results }}"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Start libvirt networks
  command: "virsh --connect {{ ard_libvirt_uri }} net-start {{ item.value.provider.libvirt.name }}"
  register: ard_libvirt_net_start
  changed_when: ard_libvirt_net_start.rc == 0
  failed_when: ard_libvirt_net_start.rc != 0 and ('already active' not in (ard_libvirt_net_start.stderr | default('')))
  loop: "{{ ard_networks | dict2items }}"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Mark libvirt networks autostart
  command: "virsh --connect {{ ard_libvirt_uri }} net-autostart {{ item.value.provider.libvirt.name }}"
  changed_when: false
  loop: "{{ ard_networks | dict2items }}"
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Discover SNO management bridge
  ansible.builtin.command:
    argv:
      - virsh
      - --connect
      - "{{ ard_libvirt_uri }}"
      - net-info
      - "{{ ard_networks[ard_management_network].provider.libvirt.name }}"
  environment:
    LC_ALL: C
  register: ard_sno_network_info
  changed_when: false
  when: ard_workload | default('') == 'sno'
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Require a discoverable SNO management bridge
  ansible.builtin.assert:
    that:
      - ard_sno_network_info.stdout_lines | select('match', '^Bridge:') | list | length == 1
    fail_msg: The SNO management libvirt network did not report exactly one bridge.
  when: ard_workload | default('') == 'sno'

- name: Resolve SNO management bridge
  ansible.builtin.set_fact:
    ard_sno_resolver_bridge: >-
      {{ ((ard_sno_network_info.stdout_lines | select('match', '^Bridge:') | first).split() | last) }}
  when: ard_workload | default('') == 'sno'

- name: Require systemd-resolved for scoped SNO DNS
  ansible.builtin.command: systemctl is-active systemd-resolved
  changed_when: false
  when: ard_workload | default('') == 'sno'
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Route the SNO cluster domain to libvirt DNS
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [resolvectl, dns, "{{ ard_sno_resolver_bridge }}", "{{ ard_networks[ard_management_network].gateway }}"]
    - [resolvectl, domain, "{{ ard_sno_resolver_bridge }}", "~{{ ard_openshift_cluster_domain }}"]
  changed_when: false
  when: ard_workload | default('') == 'sno'
  become: true
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Record SNO resolver ownership
  ansible.builtin.set_fact:
    ard_sno_resolver:
      bridge: "{{ ard_sno_resolver_bridge }}"
      domain: "{{ ard_openshift_cluster_domain }}"
      dns: "{{ ard_networks[ard_management_network].gateway }}"
  when: ard_workload | default('') == 'sno'
