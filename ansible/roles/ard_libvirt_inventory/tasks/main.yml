---
- name: Write ARD deployment inventory
  copy:
    dest: "{{ ard_deployment_dir }}/inventory.yaml"
    mode: "0644"
    content: |
      ---
      all:
        hosts:
      {% set peer_names = ard_nodes | selectattr('groups', 'contains', 'peers') | map(attribute='name') | list %}
      {% for node in ard_nodes %}
      {% set management_network = (node.networks | selectattr('name', 'equalto', ard_management_network) | list | first) %}
      {% set bridge_offset = bridge_address_offset | int if 'switch' in node.groups else (bridge_address_offset | int + 1 + peer_names.index(node.name)) if 'peers' in node.groups else none %}
          {{ node.name }}:
            ansible_connection: ssh
            ansible_host: {{ management_network.ip }}
            ansible_user: {{ (node.management | default({})).get('ansible_user', 'stack') }}
            ansible_private_key_file: {{ lookup('env', 'HOME') }}/.ssh/id_ed25519_stack
            ansible_ssh_common_args: {{ ard_libvirt_guest_ssh_common_args | to_json }}
            ard_deployment_name: {{ ard_deployment_name }}
            ard_provider_resource_name: {{ node.provider_resource_name | default('ard-' + ard_deployment_name + '-' + node.name) }}
            nodepool:
              private_ipv4: {{ management_network.ip }}
              public_ipv4: {{ management_network.ip }}
              public_ipv6: ""
      {% if bridge_offset is not none %}
              bridge_ipv4: {{ bridge_address_prefix }}.{{ bridge_offset }}
      {% endif %}
            zuul:
              executor:
                log_root: /tmp/zuul_logs
                work_root: /tmp/work_root
      {% endfor %}
        children:
          ard_provider_nodes:
            hosts:
      {% for node in ard_nodes %}
              {{ node.name }}:
      {% endfor %}
          ard_mutable_nodes:
            hosts:
      {% for node in ard_nodes if (node.management | default({})).get('mode', 'mutable') == 'mutable' %}
              {{ node.name }}:
      {% endfor %}
          ard_externally_managed_nodes:
            hosts:
      {% for node in ard_nodes if (node.management | default({})).get('mode', 'mutable') != 'mutable' %}
              {{ node.name }}:
      {% endfor %}
      {% set group_names = [] %}
      {% for node in ard_nodes %}
      {% for group in node.groups %}
      {% if group not in group_names %}
      {% set _ = group_names.append(group) %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {% for group in group_names %}
          {{ group }}:
            hosts:
      {% for node in ard_nodes if group in node.groups %}
              {{ node.name }}:
      {% endfor %}
      {% endfor %}

- name: Add ARD nodes to active inventory
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    groups: >-
      {{ ['ard_provider_nodes',
          ('ard_mutable_nodes'
           if (item.management | default({})).get('mode', 'mutable') == 'mutable'
           else 'ard_externally_managed_nodes')] + item.groups }}
    ansible_connection: ssh
    ansible_host: "{{ ard_inventory_management_network.ip }}"
    ansible_user: "{{ (item.management | default({})).get('ansible_user', 'stack') }}"
    ansible_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_stack"
    ansible_ssh_common_args: "{{ ard_libvirt_guest_ssh_common_args }}"
    ard_deployment_name: "{{ ard_deployment_name }}"
    ard_provider_resource_name: "{{ item.provider_resource_name | default('ard-' + ard_deployment_name + '-' + item.name) }}"
    nodepool: >-
      {{ {'private_ipv4': ard_inventory_management_network.ip,
          'public_ipv4': ard_inventory_management_network.ip,
          'public_ipv6': ''} |
         combine({'bridge_ipv4': ard_inventory_bridge_ipv4} if ard_inventory_bridge_ipv4 | length > 0 else {}) }}
    zuul:
      executor:
        log_root: /tmp/zuul_logs
        work_root: /tmp/work_root
  vars:
    ard_inventory_management_network: "{{ item.networks | selectattr('name', 'equalto', ard_management_network) | list | first }}"
    ard_inventory_peer_names: "{{ ard_nodes | selectattr('groups', 'contains', 'peers') | map(attribute='name') | list }}"
    ard_inventory_bridge_ipv4: >-
      {{ bridge_address_prefix ~ '.' ~ (bridge_address_offset | int) if 'switch' in item.groups else
         bridge_address_prefix ~ '.' ~ (bridge_address_offset | int + 1 + ard_inventory_peer_names.index(item.name)) if 'peers' in item.groups else '' }}
  loop: "{{ ard_nodes }}"

- name: Write ARD provider state
  copy:
    dest: "{{ ard_deployment_dir }}/provider-state.yaml"
    mode: "0644"
    content: |
      ---
      ard_provider: libvirt
      ard_deployment_name: {{ ard_deployment_name }}
      ard_libvirt_uri: {{ ard_libvirt_uri }}
      ard_libvirt_execution_host: {{ ard_libvirt_execution_host_resolved | to_json }}
      ard_management_network: {{ ard_management_network }}
      ard_libvirt_network_name: {{ ard_libvirt_network_name }}
      ard_libvirt_image_dir_root: {{ ard_libvirt_image_dir_resolved }}
      ard_libvirt_image_dir: {{ ard_libvirt_deployment_image_dir_resolved }}
      ard_libvirt_image_cache_dir: {{ ard_libvirt_cache_dir_resolved }}
      ard_libvirt_render_dir: {{ ard_libvirt_remote_render_dir }}
      ard_libvirt_phase: resources_created
      ard_cached_base_image: {{ ard_cached_base_image | default('') }}
      ard_libvirt_base_image: {{ ard_libvirt_base_image | default('') }}
      {% if ard_networks | length == 0 %}
      networks: []
      {% else %}
      networks:
      {% for network_name, network in ard_networks.items() %}
        - name: {{ network_name }}
          libvirt_name: {{ network.provider.libvirt.name }}
          mode: {{ network.mode | default('nat') }}
      {% if network.cidr is defined %}
          cidr: {{ network.cidr }}
      {% endif %}
      {% if network.gateway is defined %}
          gateway: {{ network.gateway }}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% if ard_nodes | length == 0 %}
      domains: []
      {% else %}
      domains:
      {% for node in ard_nodes %}
      {% set management_network = (node.networks | selectattr('name', 'equalto', ard_management_network) | list | first) %}
        - inventory_name: {{ node.name }}
          name: {{ node.provider_resource_name | default('ard-' + ard_deployment_name + '-' + node.name) }}
          ip: {{ management_network.ip }}
          mac: {{ management_network.mac }}
          networks:
      {% for node_network in node.networks %}
            - name: {{ node_network.name }}
      {% if node_network.ip is defined %}
              ip: {{ node_network.ip }}
      {% endif %}
              mac: {{ node_network.mac }}
      {% endfor %}
          provisioning_method: {{ (node.provisioning | default({})).get('method', 'cloud-image') }}
          start_phase: {{ (node.lifecycle | default({})).get('start_phase', 'apply') }}
          overlay: {{ ard_libvirt_deployment_image_dir_resolved }}/{{ node.name }}.qcow2
      {% if (node.provisioning | default({})).get('method', 'cloud-image') == 'install-media' %}
          install_media: {{ ard_libvirt_deployment_image_dir_resolved }}/{{ node.name }}-install.iso
          install_media_target: {{ 'sdb' if ard_flavors[node.flavor].provider.libvirt.disk_bus | default('virtio') == 'scsi' else 'sda' }}
      {% else %}
          seed: {{ ard_libvirt_deployment_image_dir_resolved }}/{{ node.name }}-seed.iso
      {% endif %}
          console_log: {{ ard_libvirt_deployment_image_dir_resolved }}/{{ node.name }}-console.log
      {% endfor %}
      {% endif %}
      {% if ard_sno_state is defined or ard_libvirt_existing_state.sno is defined %}
      sno:
      {{ ((ard_sno_state | default(ard_libvirt_existing_state.sno)) |
          combine({'resolver': ard_sno_resolver}, recursive=True)
          if ard_sno_resolver is defined
          else (ard_sno_state | default(ard_libvirt_existing_state.sno))) |
         to_nice_yaml(indent=2, sort_keys=False) | indent(2, first=True) }}
      {% endif %}
  when: ard_provider_inventory_write_state | default(true) | bool
