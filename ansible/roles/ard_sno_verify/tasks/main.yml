---
- name: Load standalone SNO nodes
  ansible.builtin.include_vars:
    file: "{{ ard_deployment_dir }}/nodes.yaml"

- name: Load standalone SNO provider state
  ansible.builtin.include_vars:
    file: "{{ ard_deployment_dir }}/provider-state.yaml"
    name: ard_sno_verify_provider_state

- name: Require completed standalone SNO lifecycle
  ansible.builtin.assert:
    that:
      - ard_sno_verify_provider_state.sno.phase == 'disk_boot_validated'
      - not (ard_sno_verify_provider_state.sno.requires_clean | default(false) | bool)
      - ard_sno_verify_provider_state.sno.boot_id_before_reboot | default('') | length > 0
      - ard_sno_verify_provider_state.sno.boot_id_after_reboot | default('') | length > 0
      - >-
        ard_sno_verify_provider_state.sno.boot_id_before_reboot !=
        ard_sno_verify_provider_state.sno.boot_id_after_reboot
    fail_msg: Standalone SNO deploy has not completed disk-boot validation.

- name: Set standalone SNO verification state
  ansible.builtin.set_fact:
    ard_sno_state: "{{ ard_sno_verify_provider_state.sno }}"
    ard_sno_verify_domain: "{{ ard_sno_verify_provider_state.domains[0] }}"
    ard_sno_verify_node: >-
      {{ ard_nodes | selectattr('provisioning.method', 'equalto', 'install-media') | first }}

- name: Resolve deployment-local SNO command environment
  ansible.builtin.set_fact:
    ard_sno_command_environment:
      TMPDIR: "{{ ard_sno_state.remote_state_dir | dirname }}/tmp"
      XDG_CACHE_HOME: "{{ ard_sno_state.remote_state_dir | dirname }}/cache"

- name: Restore libvirt execution host for SNO verification
  ansible.builtin.include_role:
    name: ard_libvirt_execution
  vars:
    ard_libvirt_execution_persist_state: false

- name: Resolve SNO API from the execution host
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "api.{{ ard_sno_state.cluster_domain }}"
  changed_when: false
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Revalidate standalone SNO API and node
  ansible.builtin.include_role:
    name: ard_sno_deploy
    tasks_from: validate.yml

- name: Read default local-path annotation
  ansible.builtin.command:
    argv:
      - "{{ ard_sno_state.remote_oc }}"
      - --kubeconfig
      - "{{ ard_sno_state.remote_kubeconfig }}"
      - --cache-dir
      - "{{ ard_sno_state.remote_state_dir }}/cache/kube"
      - get
      - storageclass
      - local-path
      - -o
      - jsonpath={.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}
  environment: "{{ ard_sno_command_environment }}"
  register: ard_sno_default_storage_class
  changed_when: false
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Read persisted storage smoke PVC
  ansible.builtin.command:
    argv:
      - "{{ ard_sno_state.remote_oc }}"
      - --kubeconfig
      - "{{ ard_sno_state.remote_kubeconfig }}"
      - --cache-dir
      - "{{ ard_sno_state.remote_state_dir }}/cache/kube"
      - -n
      - "{{ ard_sno_smoke_namespace }}"
      - get
      - pvc/smoke-pvc
      - -o
      - json
  environment: "{{ ard_sno_command_environment }}"
  register: ard_sno_verify_smoke_pvc
  changed_when: false
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Read persisted storage smoke Job
  ansible.builtin.command:
    argv:
      - "{{ ard_sno_state.remote_oc }}"
      - --kubeconfig
      - "{{ ard_sno_state.remote_kubeconfig }}"
      - --cache-dir
      - "{{ ard_sno_state.remote_state_dir }}/cache/kube"
      - -n
      - "{{ ard_sno_smoke_namespace }}"
      - get
      - job/smoke-write
      - -o
      - json
  environment: "{{ ard_sno_command_environment }}"
  register: ard_sno_verify_smoke_job
  changed_when: false
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Build structured disk-only SNO identity command
  ansible.builtin.set_fact:
    ard_sno_verify_identity_argv:
      - "{{ ard_libvirt_domain_identity_helper }}"
      - --uri
      - "{{ ard_libvirt_uri }}"
      - --domain
      - "{{ ard_sno_verify_domain.name }}"
      - --root-source
      - "{{ ard_sno_verify_domain.overlay }}"
      - --root-target
      - >-
        {{ 'sda' if
           (ard_flavors[ard_sno_verify_node.flavor].provider.libvirt.disk_bus |
            default('virtio')) == 'scsi' else 'vda' }}
      - --root-bus
      - >-
        {{ ard_flavors[ard_sno_verify_node.flavor].provider.libvirt.disk_bus |
           default('virtio') }}
      - --media-source
      - "{{ ard_sno_verify_domain.install_media }}"
      - --media-target
      - "{{ ard_sno_verify_domain.install_media_target }}"
      - --media-policy
      - absent

- name: Add expected SNO interfaces to verification command
  ansible.builtin.set_fact:
    ard_sno_verify_identity_argv: >-
      {{ ard_sno_verify_identity_argv +
         ['--interface', item.mac + '=' + ard_networks[item.name].provider.libvirt.name] }}
  loop: "{{ ard_sno_verify_node.networks }}"

- name: Verify persistent and live SNO disk-only identity
  ansible.builtin.command:
    argv: "{{ ard_sno_verify_identity_argv }}"
  changed_when: false
  delegate_to: "{{ ard_libvirt_execution_host_name }}"

- name: Verify default storage and durable smoke evidence
  ansible.builtin.assert:
    that:
      - ard_sno_default_storage_class.stdout == 'true'
      - (ard_sno_verify_smoke_pvc.stdout | from_json).status.phase == 'Bound'
      - >-
        (ard_sno_verify_smoke_pvc.stdout | from_json).metadata.get(
          'annotations', {}).get('ard.test/write-validated', '') == 'true'
      - >-
        (ard_sno_verify_smoke_pvc.stdout | from_json).metadata.get(
          'annotations', {}).get('ard.test/write-pvc-uid', '') ==
        (ard_sno_verify_smoke_pvc.stdout | from_json).metadata.uid
      - >-
        (ard_sno_verify_smoke_pvc.stdout | from_json).metadata.get(
          'annotations', {}).get('ard.test/write-job-uid', '') ==
        (ard_sno_verify_smoke_job.stdout | from_json).metadata.uid
      - (ard_sno_verify_smoke_job.stdout | from_json).status.succeeded | default(0) | int == 1
    fail_msg: Standalone SNO storage or disk-only boot verification failed.
